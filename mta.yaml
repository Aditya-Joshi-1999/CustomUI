_schema-version: "3.2"
ID: studentDetails
version: 0.0.1
modules:
- name: studentDetails-destination-content
  type: com.sap.application.content
  requires:
  - name: studentDetails-destination-service
    parameters:
      content-target: true
  - name: studentDetails_html_repo_host
    parameters:
      service-key:
        name: studentDetails_html_repo_host-key
  - name: uaa_studentDetails
    parameters:
      service-key:
        name: uaa_studentDetails-key
  parameters:
    content:
      subaccount:
        destinations:
        - Name: app_studentDetails_studentDetails_html_repo_host
          ServiceInstanceName: studentDetails-html5-app-host-service
          ServiceKeyName: studentDetails_html_repo_host-key
          sap.cloud.service: app.studentDetails
        - Authentication: OAuth2UserTokenExchange
          Name: app_studentDetails_uaa_studentDetails
          ServiceInstanceName: studentDetails-xsuaa-service
          ServiceKeyName: uaa_studentDetails-key
          sap.cloud.service: app.studentDetails
        existing_destinations_policy: ignore
  build-parameters:
    no-source: true
- name: studentDetails-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: studentDetails_html_repo_host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - studentDetailsuistudentDetailsui.zip
      name: studentDetailsuistudentDetailsui
      target-path: resources/
- name: studentDetailsuistudentDetailsui
  type: html5
  path: studentDetails-ui
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: studentDetails-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        subaccount:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: studentDetails-destination-service
    service-plan: lite
- name: studentDetails_html_repo_host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: studentDetails-html5-app-host-service
    service-plan: app-host
- name: uaa_studentDetails
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-name: studentDetails-xsuaa-service
    service-plan: application
parameters:
  deploy_mode: html5-repo
